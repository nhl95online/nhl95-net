name: Daily Discord Gazette Summary

on:
  schedule:
    # Runs automatically every day at 12:00 UTC (8:00 AM EDT / 5:00 AM PDT)
    - cron: '0 12 * * *'
  # Allows you to manually trigger the workflow from the Actions tab in GitHub anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install discord.py

      - name: Run Discord Summary Generator
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python scripts/discord_daily_summary.py

      - name: Commit and Push Updated Briefing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore(gazette): update daily discord briefing [skip ci]" && git push)
