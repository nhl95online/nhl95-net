name: Discord Save State Bot (24/7 on GitHub)

# Every run shows the same title in the Actions list (instead of the commit message),
# so it's clear each run is just the next shift of the same always-on bot.
run-name: "🏒 Discord Save State Bot — Live Shift (${{ github.event_name == 'schedule' && 'backup start' || github.event_name == 'push' && 'new code' || (github.event_name == 'workflow_dispatch' && inputs.restart == 'false') && 'handoff' || 'manual start' }})"

# Runs the full NHL95 Discord bot LIVE on GitHub Actions — no local PC needed.
# While a shift is running the bot is connected to Discord and processes every save state
# the moment it is dropped (Discord pushes the message to the bot instantly; a 15s re-scan backs it up).
# GitHub caps a job at 6h, so each shift runs ~5h40m and then STARTS ITS OWN SUCCESSOR
# (handoff gap ≈ 40s). The cron below is only a backup in case a handoff ever fails.
# Every shift also re-scans the last 96h on startup, so nothing dropped during a handoff is missed.
# Live status: https://prdfunbzqsvqlyiwmuqp.supabase.co/storage/v1/object/public/roms/bot-status/heartbeat-github.json

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      restart:
        description: 'Replace the running shift right away (true) or queue behind it (false)'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - 'scripts/discord_savestate_bot.py'
      - 'lib/seasons/**'
      - '.github/workflows/savestate_bot.yml'

# Only one bot online at a time (two would double-post every reply).
# Scheduled backups and automatic handoffs queue behind the live shift;
# a code push or a manual "Run workflow" replaces the live shift so new code takes effect right away.
concurrency:
  group: discord-savestate-bot
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.restart != 'false') }}

permissions:
  contents: read
  actions: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/savestate_bot.yml'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install discord.py Pillow
          # Verdana/Arial (same fonts as the Windows PC) so boxscore, standings, bracket & opponent graphics look identical
          echo "ttf-mscorefonts-installer msttcorefonts/accept-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq > /dev/null || true
          timeout 240 sudo apt-get install -y -qq ttf-mscorefonts-installer fonts-dejavu-core fonts-liberation > /dev/null || true
          ls /usr/share/fonts/truetype/msttcorefonts/ 2>/dev/null | head -n 20 || echo "msttcorefonts unavailable — using DejaVu/Liberation fallbacks"

      # Fails the run with a clear red X if the Discord token / Supabase key secrets are wrong or Discord blocks the runner
      - name: Check Discord & Supabase Access
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing DISCORD_BOT_TOKEN or SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi
          TOKEN=$(printf '%s' "$DISCORD_BOT_TOKEN" | tr -d '"'"'"' \r\n')
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' -H "Authorization: Bot $TOKEN" https://discord.com/api/v10/users/@me)
          echo "Discord API status: $code"
          python -c "import json;d=json.load(open('/tmp/me.json'));print('Bot user:', d.get('username'), d.get('id'))" 2>/dev/null || head -c 300 /tmp/me.json
          if [ "$code" != "200" ]; then
            echo "::error::Discord rejected the bot token from GitHub (HTTP $code). Re-paste DISCORD_BOT_TOKEN secret (no quotes/spaces)."
            exit 1
          fi
          scode=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "https://prdfunbzqsvqlyiwmuqp.supabase.co/rest/v1/leagues?select=league_id&limit=1")
          echo "Supabase API status: $scode"
          if [ "$scode" != "200" ]; then
            echo "::error::Supabase rejected SUPABASE_SERVICE_ROLE_KEY (HTTP $scode)."
            exit 1
          fi

      # Queue the NEXT shift right away: it waits (concurrency) and starts the instant this one ends,
      # so there is never a long gap between shifts even if GitHub's cron is delayed.
      - name: Queue Next Shift
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run savestate_bot.yml --ref main -f restart=false || echo "::warning::Could not queue next shift (cron backup will cover it)"

      # Persist coach mute settings (FUCK OFF / GAME ON) and MODE PLAYOFFS/SEASON triggers between runs
      - name: Restore Bot State
        uses: actions/cache/restore@v4
        with:
          path: |
            data/coach_notifications.json
            data/league_mode.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Run Bot Live (~5h40m)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://prdfunbzqsvqlyiwmuqp.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PARTNER_INGEST_URL: ${{ secrets.PARTNER_INGEST_URL || 'https://gwaiwtgwdqadxmimiskf.supabase.co/functions/v1/process-game-state' }}
          PARTNER_WEBHOOK_SECRET: ${{ secrets.PARTNER_WEBHOOK_SECRET }}
          PYTHONUNBUFFERED: '1'
        run: |
          export DISCORD_BOT_TOKEN=$(printf '%s' "$DISCORD_BOT_TOKEN" | tr -d '"'"'"' \r\n')
          python scripts/discord_savestate_bot.py --max-runtime-minutes 335 --backfill-hours 96

      - name: Save Bot State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/coach_notifications.json
            data/league_mode.json
          key: bot-state-${{ github.run_id }}
