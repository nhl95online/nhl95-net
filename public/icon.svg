<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Puck Body Gradient -->
    <radialGradient id="puckGrad" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Metallic Blue League Ring Gradient -->
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 3D Gold Extrusion Gradient -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Gold Face Gradient -->
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="20%" stop-color="#facc15"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Outer Puck Shadow & Grip -->
  <circle cx="32" cy="32" r="31" fill="#020617" />
  <circle cx="32" cy="32" r="30" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Puck Edge Knurling (segmented sports grip) -->
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- League Royal Blue Bevel Ring -->
  <circle cx="32" cy="32" r="27.5" fill="url(#blueRing)" stroke="#000" stroke-width="1"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#93c5fd" stroke-width="0.75" opacity="0.8"/>

  <!-- Inner Dark Puck Core / Ice -->
  <circle cx="32" cy="32" r="23" fill="url(#puckGrad)" stroke="#020617" stroke-width="1.2"/>

  <!-- Subtle Ice Scratches in Hockey Arena -->
  <path d="M16 26 L23 21 M40 40 L48 43 M18 42 L25 38 M38 22 L45 19" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.25" stroke-linecap="round"/>

  <!-- 3D Gold "95" Emblem with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- 9: Shadow / 3D Extrusion -->
    <path d="
      M18 21 h12 v23 h-11 v-6 h5 v2 h3 v-6 h-9 v-13 z
      M22 25 h4 v4 h-4 z
    " fill="#000" transform="translate(1.5, 1.5)" />
    
    <path d="
      M18 21 h12 v23 h-11 v-6 h5 v2 h3 v-6 h-9 v-13 z
      M22 25 h4 v4 h-4 z
    " fill="url(#goldBevel)" transform="translate(0.8, 0.8)" />

    <!-- 9: Front Face -->
    <path d="
      M 18 21 
      h 12 
      v 23 
      h -11 
      v -6 
      h 5 
      v 2 
      h 3 
      v -6 
      h -9 
      v -13 
      z
      M 22 25 
      h 4 
      v 4 
      h -4 
      z
    " fill="url(#goldFace)" stroke="#78350f" stroke-width="0.5" />

    <!-- 5: Shadow / 3D Extrusion -->
    <path d="
      M 34 21 
      h 12 
      v 4.5 
      h -7 
      v 4 
      h 7 
      v 14.5 
      h -12 
      v -5.5 
      h 7 
      v 1.5 
      h 2 
      v -6 
      h -9 
      z
    " fill="#000" transform="translate(1.5, 1.5)" />

    <path d="
      M 34 21 
      h 12 
      v 4.5 
      h -7 
      v 4 
      h 7 
      v 14.5 
      h -12 
      v -5.5 
      h 7 
      v 1.5 
      h 2 
      v -6 
      h -9 
      z
    " fill="url(#goldBevel)" transform="translate(0.8, 0.8)" />

    <!-- 5: Front Face -->
    <path d="
      M 34 21 
      h 12 
      v 4.5 
      h -7 
      v 4 
      h 7 
      v 14.5 
      h -12 
      v -5.5 
      h 7 
      v 1.5 
      h 2 
      v -6 
      h -9 
      z
    " fill="url(#goldFace)" stroke="#78350f" stroke-width="0.5" />
  </g>

  <!-- Top Specular Highlight on Puck Rim -->
  <path d="M20 7 A 28 28 0 0 1 44 7" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.5" />
</svg>
